<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <title>Football Fight Tactics</title>
    <!-- Telefon: yakınlaştırma yok, tüm ekran oyunun -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <!-- iPhone: "Ana Ekrana Ekle" ile açılınca adres çubuğu olmadan tam ekran -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="FFT">
    <meta name="theme-color" content="#0b0f14">
    <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
    <link rel="icon" type="image/png" href="TemplateData/icon-180.png">
    <link rel="manifest" href="TemplateData/manifest.webmanifest">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0; background: #0b0f14;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #eee;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none; touch-action: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%;
        display: block; background: #0b0f14; touch-action: none; outline: none; }
      .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        flex-direction: column; text-align: center; background: rgba(8, 11, 15, 0.94); z-index: 10; padding: 24px; box-sizing: border-box; }
      .overlay.show { display: flex; }
      .title { font-size: 26px; font-weight: 700; color: #ffd152; letter-spacing: 1px; margin-bottom: 18px; }
      .msg { font-size: 18px; line-height: 1.5; max-width: 520px; }
      .msg b { color: #ffd152; }
      .btn { margin-top: 22px; padding: 12px 28px; font-size: 17px; border-radius: 10px; border: 0;
        background: #2f7a45; color: #fff; font-weight: 600; }
      #loading .bar { width: min(420px, 70vw); height: 12px; border-radius: 6px; background: #1f2630; overflow: hidden; margin-top: 8px; }
      #loading .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2f7a45, #ffd152); transition: width 0.2s; }
      #loading .pct { margin-top: 10px; font-size: 14px; opacity: 0.7; }
      .rotate-icon { font-size: 54px; margin-bottom: 14px; animation: spin 2.2s ease-in-out infinite; }
      @keyframes spin { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      #fs-button { position: fixed; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 10px;
        background: rgba(15, 20, 28, 0.55); border: 1px solid rgba(255, 209, 82, 0.5); z-index: 5;
        display: none; align-items: center; justify-content: center; }
      #fs-button svg { width: 22px; height: 22px; }
      #error { position: fixed; left: 0; right: 0; top: 0; background: #b3261e; color: #fff; padding: 10px; font-size: 14px; display: none; z-index: 20; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loading" class="overlay show">
      <div class="title">FOOTBALL FIGHT TACTICS</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="pct" id="pct">Yükleniyor…</div>
    </div>

    <!-- Telefon dik tutulunca -->
    <div id="rotate" class="overlay">
      <div class="rotate-icon">📱</div>
      <div class="msg">Oynamak için telefonu <b>yan çevir</b>.</div>
    </div>

    <!-- iPhone'da tarayıcı tam ekranı yok: ana ekrana ekleme ipucu -->
    <div id="ios-hint" class="overlay">
      <div class="title">TAM EKRAN</div>
      <div class="msg">
        iPhone'da Safari tam ekranı desteklemiyor. Bunun yerine:<br><br>
        1. Alttaki <b>Paylaş</b> düğmesine dokun (kare ve yukarı ok)<br>
        2. <b>Ana Ekrana Ekle</b>'yi seç<br>
        3. Ana ekrandaki <b>FFT</b> simgesinden aç<br><br>
        Oyun adres çubuğu olmadan, tam ekran açılır.
      </div>
      <button class="btn" id="ios-hint-close">Tamam</button>
    </div>

    <div id="fs-button" title="Tam ekran">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffd152" stroke-width="2.4" stroke-linecap="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </div>
    <div id="error"></div>

    <script>
      var canvas = document.getElementById("unity-canvas");
      var isTouch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);
      var isIOS = /iPhone|iPod/i.test(navigator.userAgent);
      var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches
                    || window.matchMedia("(display-mode: fullscreen)").matches;

      function show(id, on) { document.getElementById(id).classList.toggle("show", on); }

      // Dikey uyarısı
      function checkOrientation() { show("rotate", isTouch && window.innerHeight > window.innerWidth); }
      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", function () { setTimeout(checkOrientation, 200); });
      checkOrientation();


      // Canvas'ı görünür alana (visualViewport) piksel olarak sabitler (Unity'ye olay göndermez).
      // iPhone Safari'de adres/araç çubuğu küçülünce görünür alan değişir; vh/dvh ile Unity'nin önbelleğe
      // aldığı canvas konumu/boyutu eski kalıp dokunmayı aşağı kaydırıyordu. Burada her değişimde ve
      // ilk saniyelerde tekrar hesaplanır.
      var lastW = 0, lastH = 0;
      function fitCanvas(force) {
        var vv = window.visualViewport;
        var w = Math.round(vv ? vv.width : window.innerWidth);
        var h = Math.round(vv ? vv.height : window.innerHeight);
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
        if (!force && w === lastW && h === lastH) return;
        lastW = w; lastH = h;
        canvas.style.left = "0px"; canvas.style.top = "0px";
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
        // Not: Unity'ye yapay "resize" olayı GÖNDERME (Unity'nin resize işleyicisiyle sonsuz özyineleme:
        // "Maximum call stack size exceeded"). Safari kendi resize olaylarını zaten gönderir.
      }
      window.addEventListener("resize", function () { fitCanvas(false); });
      window.addEventListener("orientationchange", function () { [0, 150, 400, 900].forEach(function (t) { setTimeout(function () { fitCanvas(true); }, t); }); });
      window.addEventListener("scroll", function () { fitCanvas(false); });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", function () { fitCanvas(false); });
        window.visualViewport.addEventListener("scroll", function () { fitCanvas(false); });
      }
      document.addEventListener("touchstart", function () { fitCanvas(false); }, { passive: true, capture: true });
      document.addEventListener("pointerdown", function () { fitCanvas(false); }, { capture: true });
      fitCanvas(true);
      var fitTicks = 0;
      var fitTimer = setInterval(function () { fitCanvas(false); if (++fitTicks > 30) clearInterval(fitTimer); }, 250);

      // iOS'ta sayfanın kayması / lastik efekti / çift dokunma yakınlaştırması olmasın
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      // Tam ekran düğmesi: destekleyen tarayıcıda gerçek tam ekran, iPhone'da ana ekrana ekleme ipucu
      var fsButton = document.getElementById("fs-button");
      var fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      function inFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
      function updateFsButton() { fsButton.style.display = (standalone || inFullscreen()) ? "none" : "flex"; }
      fsButton.addEventListener("click", function () {
        if (fsSupported) {
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen;
          var p = req.call(el, { navigationUI: "hide" });
          if (p && p.then) p.then(function () {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
          }).catch(function () {});
        } else {
          show("ios-hint", true);
        }
      });
      document.getElementById("ios-hint-close").addEventListener("click", function () { show("ios-hint", false); });
      document.addEventListener("fullscreenchange", updateFsButton);
      document.addEventListener("webkitfullscreenchange", updateFsButton);

      function showError(msg) { var e = document.getElementById("error"); e.textContent = msg; e.style.display = "block"; }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "aliabbastatli",
        productName: "Football Fight Tactics",
        productVersion: "0.2.0",
        // Not: devicePixelRatio burada sınırlanmamalı. iPhone 3x yoğunlukta; 2'ye sınırlamak dokunma
        // konumlarını kaydırıyordu (butona basmak için iki butonun arasına basmak gerekiyordu).
        showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); },
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("fill").style.width = (100 * progress) + "%";
          document.getElementById("pct").textContent = "Yükleniyor… %" + Math.round(100 * progress);
        }).then(function () {
          show("loading", false);
          updateFsButton();
          fitCanvas(true);
          setTimeout(function () { fitCanvas(true); }, 500);
          setTimeout(function () { fitCanvas(true); }, 1500);
          canvas.focus();
        }).catch(function (message) { showError(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
